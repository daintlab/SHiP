kontext:
  REF_IMAGE_NAME: 0.jpg
  OUT_ROOT: /result/kontext
  PROMPT_INDICES:
  MODEL_ID: black-forest-labs/FLUX.1-Kontext-dev
  NUM_STEPS: 30
  GUIDANCE_SCALE: 2.5
  SHIP:
    ENABLED: true            # options: true, false
    SITE: attn_out           # options: attn_out, mlp_out, block_input, block_output
